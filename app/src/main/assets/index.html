<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neelam QR Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<style>
:root{--p:#4361ee;--p2:#7209b7;--bg:#f5f7fa;--card:#fff;--text:#212529;--muted:#6c757d}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);color:var(--text);min-height:100vh;padding:16px}
.card{max-width:800px;margin:24px auto;background:var(--card);padding:28px;border-radius:18px;box-shadow:0 10px 30px #0002}
h1,h2{margin-top:0}.center{text-align:center}.hidden{display:none!important}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:16px}
.btn{border:0;background:var(--p);color:#fff;padding:12px 20px;border-radius:9px;font-weight:700;cursor:pointer;margin:6px}.btn2{background:var(--p2)}
.drop{border:2px dashed #bdc3c7;border-radius:12px;height:190px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;background:#f8f9fa}
.drop.active{border-color:var(--p);background:#edf2ff}#file{display:none}
.preview{max-width:200px;max-height:150px;display:block;margin:15px auto;border-radius:8px}
.msg{padding:11px;border-radius:8px;margin:12px 0}.ok{background:#dff7ef;color:#08734d}.err{background:#ffe4ed;color:#a10d42}
.qr{max-width:250px;border:8px solid white;border-radius:10px;box-shadow:0 8px 20px #0002}
.footer{text-align:center;color:#6c757d;margin:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.small{font-size:13px;color:var(--muted)}.history{margin-top:20px;text-align:left}.item{padding:10px;border-bottom:1px solid #eee;word-break:break-all}
</style>
</head>
<body>
<div id="login" class="card" style="max-width:430px">
  <div class="center"><h1>🔐 Admin Login</h1><p class="small">QR Code Generator</p></div>
  <input id="user" placeholder="Username" autocomplete="username">
  <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
  <button class="btn" style="width:100%" onclick="login()">Login</button>
  <div id="loginMsg" class="msg err hidden"></div>
</div>

<div id="app" class="card hidden">
  <div class="top"><div><h1>QR Code Generator</h1><p class="small">Upload an image and generate a shareable QR code</p></div><button class="btn btn2" onclick="logout()">Logout</button></div>
  <label id="drop" class="drop"><b>📤 Click or drag image here</b><span class="small">JPG, PNG, GIF • Max 5 MB</span><input id="file" type="file" accept="image/*"></label>
  <div id="info" class="small center"></div><img id="preview" class="preview hidden">
  <div id="msg" class="msg hidden"></div>
  <div class="center"><button id="gen" class="btn" disabled onclick="generate()">⚡ Generate QR Code</button></div>
  <div id="result" class="center hidden"><h2>Your QR Code</h2><img id="qr" class="qr"><br><a id="download"><button class="btn btn2">⬇️ Download QR</button></a></div>
  <div class="history"><h3>Recent QR History</h3><div id="history" class="small">No QR codes yet.</div></div>
</div>
<div class="footer">Made in ❤️ for Neelam</div>

<script>
const API_BASE_URL = localStorage.getItem('qr_api_base_url') || '';
const API_ENDPOINT = API_BASE_URL ? API_BASE_URL.replace(/\/$/,'') + '/api/imgbb-upload' : '/api/imgbb-upload';
let selected=null;
const $=id=>document.getElementById(id);
function login(){
 if($('user').value==='Neelam' && $('pass').value==='Neelam143'){
   sessionStorage.setItem('qr_login','1'); $('login').classList.add('hidden'); $('app').classList.remove('hidden');
 } else {$('loginMsg').textContent='Invalid username or password';$('loginMsg').classList.remove('hidden')}
}
function logout(){sessionStorage.removeItem('qr_login');location.reload()}
if(sessionStorage.getItem('qr_login')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
$('drop').onclick=e=>{if(e.target.id!=='file')$('file').click()};
$('file').onchange=handleFile;
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('active')};
$('drop').ondragleave=()=> $('drop').classList.remove('active');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('active');if(e.dataTransfer.files[0]){selected=e.dataTransfer.files[0];renderFile()}};
function handleFile(e){selected=e.target.files[0];renderFile()}
function renderFile(){
 if(!selected)return;
 if(!selected.type.startsWith('image/')||selected.size>5*1024*1024){show('Invalid image or file is over 5 MB.','err');selected=null;$('gen').disabled=true;return}
 $('info').textContent=`Selected: ${selected.name} (${(selected.size/1024).toFixed(1)} KB)`;
 $('preview').src=URL.createObjectURL(selected);$('preview').classList.remove('hidden');$('gen').disabled=false;hide();
}
async function generate(){
 if(!selected)return; $('gen').disabled=true; show('Uploading image and generating QR…','ok');
 try{
   const fd=new FormData();fd.append('image',selected);
   const r=await fetch(API_ENDPOINT,{method:'POST',body:fd});
   if(!r.ok) throw new Error('Upload service unavailable');
   const d=await r.json(); if(!d.url) throw new Error(d.error||'Upload failed');
   QRCode.toDataURL(d.url,{width:250,margin:2,color:{dark:'#4361ee',light:'#fff'}},(e,url)=>{
     if(e)throw e;$('qr').src=url;$('download').href=url;$('result').classList.remove('hidden');addHistory(d.url);show('QR code generated successfully!','ok')
   });
 }catch(e){show('Secure upload endpoint is not configured or upload failed. Configure /api/imgbb-upload with IMGBB_API_KEY.','err')}
 finally{$('gen').disabled=false}
}
function addHistory(url){let h=JSON.parse(localStorage.getItem('qr_history')||'[]');h.unshift({url,time:new Date().toLocaleString()});localStorage.setItem('qr_history',JSON.stringify(h.slice(0,10)));renderHistory()}
function renderHistory(){let h=JSON.parse(localStorage.getItem('qr_history')||'[]');$('history').innerHTML=h.length?h.map(x=>`<div class="item">${x.time}<br>${x.url}</div>`).join(''):'No QR codes yet.'}
function show(t,c){$('msg').textContent=t;$('msg').className='msg '+c}
function hide(){$('msg').classList.add('hidden')}
renderHistory();
</script>
</body></html>
